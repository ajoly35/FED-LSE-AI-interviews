<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FED/LSE Academic Research Interview</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f7f9fa;
      color: #1a202c;
      text-align: center;
      padding: 20px;
    }
    .container {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 500px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 12px;
      color: #2d3748;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #4a5568;
      margin-bottom: 24px;
    }
    .status {
      font-size: 14px;
      color: #718096;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>FED / LSE Research Study</h1>
    <p>Please click below to start your brief follow-up voice interview. When finished, you will be automatically returned to complete the study.</p>
    
    <elevenlabs-convai agent-id="agent_0201m48f2094fw08nar21wz9d2ra"></elevenlabs-convai>
    
    <div class="status" id="status-text">Ready to connect...</div>
  </div>

  <script src="https://elevenlabs.io/convai-widget/index.js" async type="text/javascript"></script>

  <script>
    const qualtricsReturnUrl = "https://your-qualtrics-survey-url";

    const urlParams = new URLSearchParams(window.location.search);
    const responseId = urlParams.get("response_id") || "";
    const businessAge = urlParams.get("business_age") || "";
    const employeeCount = urlParams.get("employee_count") || "";
    const clientBase = urlParams.get("client_base") || "";
    const aiToolsUsed = urlParams.get("ai_tools_used") || "";

    const widget = document.querySelector("elevenlabs-convai");

    widget.setAttribute("dynamic-variables", JSON.stringify({
      business_age: businessAge,
      employee_count: employeeCount,
      client_base: clientBase,
      ai_tools_used: aiToolsUsed
    }));

    widget.addEventListener("elevenlabs-convai:call-tool", (event) => {
      if (event.detail && event.detail.name === "end_interview") {
        document.getElementById("status-text").innerText = "Interview complete. Returning to Qualtrics...";
        const destination = responseId
          ? `${qualtricsReturnUrl}?response_id=${encodeURIComponent(responseId)}`
          : qualtricsReturnUrl;
        setTimeout(() => {
          window.location.href = destination;
        }, 1200);
      }
    });
  </script>
</body>
</html>
