<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Research Interview | FED & LSE Study</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      max-width: 620px;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      padding: 36px 32px;
      text-align: center;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      margin-top: 0;
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
      color: #475569;
      margin-bottom: 28px;
    }
    .widget-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 16px;
      min-height: 120px;
    }
    elevenlabs-convai {
      position: static !important;
      display: inline-block;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Academic Research Interview</h1>
    <p>
      Thank you for completing the initial survey questions. Please click the button below to begin your brief voice-based research interview regarding business demographics and technology adoption for the joint FED and LSE study.
    </p>

    <!-- Centered embedded widget container -->
    <div class="widget-container">
      <elevenlabs-convai 
        agent-id="agent_0201m48f2094fw08nar21wz9d2ra">
      </elevenlabs-convai>
    </div>
  </div>

  <script src="https://elevenlabs.io/convai-widget/index.js" async type="text/javascript"></script>

  <script>
    // 1. Read survey variables from URL query parameters
    const urlParams = new URLSearchParams(window.location.search);
    const responseId = urlParams.get('response_id') || 'UNKNOWN';
    const businessAge = urlParams.get('business_age') || 'Not specified';
    const employeeCount = urlParams.get('employee_count') || 'Not specified';
    const clientBase = urlParams.get('client_base') || 'Not specified';
    const aiToolsUsed = urlParams.get('ai_tools_used') || 'Not specified';

    // 2. Set your destination return URL for Qualtrics Part 2
    const qualtricsReturnUrl = "https://your-qualtrics-completion-survey-url";

    // 3. Pass dynamic variables to the widget and register redirect handler
    window.addEventListener('load', () => {
      const widget = document.querySelector('elevenlabs-convai');

      if (widget) {
        // Pass variables to the ElevenLabs Agent
        widget.setAttribute('dynamic-variables', JSON.stringify({
          business_age: businessAge,
          employee_count: employeeCount,
          client_base: clientBase,
          ai_tools_used: aiToolsUsed
        }));

        // Listen for the custom client tool event to redirect upon completion
        widget.addEventListener('elevenlabs-convai:call', (event) => {
          if (event.detail && event.detail.name === 'end_interview') {
            console.log('Interview completed. Redirecting to Qualtrics...');
            window.location.href = qualtricsReturnUrl + (qualtricsReturnUrl.includes('?') ? '&' : '?') + 'response_id=' + encodeURIComponent(responseId);
          }
        });
      }
    });
  </script>

</body>
</html>
