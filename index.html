<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FED / LSE Research Study - AI Interview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      max-width: 580px;
      width: 90%;
      margin: 20px auto;
      padding: 40px 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      text-align: center;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #1e293b;
    }
    p.subtitle {
      font-size: 15px;
      color: #64748b;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .widget-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 160px;
      margin-top: 20px;
    }
    .notice {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>FED / LSE Research Study</h1>
    <p class="subtitle">Brief follow-up study on business demographics and AI adoption.</p>
    
    <div class="widget-container">
      <elevenlabs-convai 
        agent-id="agent_0201m48f2094fw08nar21wz9d2ra" 
        variant="compact">
      </elevenlabs-convai>
    </div>

    <p class="notice">Please ensure your microphone is enabled before starting.</p>
  </div>

  <script src="https://elevenlabs.io/convai-widget/index.js" async type="text/javascript"></script>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const responseId = urlParams.get('response_id') || '';
    const businessAge = urlParams.get('business_age') || '';
    const employeeCount = urlParams.get('employee_count') || '';
    const clientBase = urlParams.get('client_base') || '';
    const aiToolsUsed = urlParams.get('ai_tools_used') || '';

    // LSE Qualtrics base survey return link
    const qualtricsBaseUrl = "https://lse.eu.qualtrics.com/jfe/form/SV_8dzLCFfMXtrEDXM";

    window.addEventListener('elevenlabs-convai:call', (event) => {
      if (event.detail && event.detail.config) {
        event.detail.config.dynamicVariables = {
          business_age: businessAge,
          employee_count: employeeCount,
          client_base: clientBase,
          ai_tools_used: aiToolsUsed
        };
        
        event.detail.config.clientTools = {
          end_interview: async () => {
            if (responseId) {
              window.location.href = `${qualtricsBaseUrl}?Q_R=${encodeURIComponent(responseId)}&Q_R_DEL=0&interview_completed=true`;
            } else {
              window.location.href = `${qualtricsBaseUrl}?interview_completed=true`;
            }
          }
        };
      }
    });
  </script>
</body>
</html>
